name: RuboCop autocorrect (temporary)

on:
  push:
    branches: [rubocop-cleanup]

jobs:
  autocorrect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libmagic-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Safe autocorrect
        run: bundle exec rubocop -a --format quiet || true
      - name: Patch (gzip, base64)
        run: |
          echo "BEGIN-PATCH"
          git diff -- . ':!.github' | gzip -9 | base64
          echo "END-PATCH"
      - name: Remaining offenses
        run: bundle exec rubocop --format emacs || true
