name: RuboCop

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install system libraries for native gems
        run: sudo apt-get update && sudo apt-get install -y libmagic-dev
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop --format github --format simple --parallel
